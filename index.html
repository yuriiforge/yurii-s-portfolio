<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#080e09"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Applies the stored theme before first paint so there is no flash. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          var dark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>

    <title>Yurii S. — Full-Stack Web Developer</title>
    <meta
      name="description"
      content="Full-Stack JavaScript/TypeScript developer with 5 years of commercial experience building SaaS products, AI-powered applications and enterprise dashboards with React, Next.js, Node.js and NestJS."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yurii S. — Full-Stack Web Developer" />
    <meta
      property="og:description"
      content="5 years building scalable SaaS, AI-powered applications and enterprise platforms with React, Next.js, Node.js and NestJS."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
